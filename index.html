<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WonderRead - المكتبة الرقمية</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0f111a;
            --card-bg: #1a1d2e;
            --accent-gold: #c5a059;
            --accent-gold-hover: #dfb76c;
            --text-light: #f5f6fa;
            --text-gray: #a4b0be;
            --border-color: #2f3542;
            --danger-red: #e74c3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        header {
            background: linear-gradient(180deg, #16192b 0%, var(--bg-dark) 100%);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--accent-gold);
            position: relative;
        }

        .header-title {
            font-size: 26px;
            font-weight: 900;
            color: var(--accent-gold);
            letter-spacing: 1px;
        }

        .admin-toggle-btn {
            position: absolute;
            left: 20px;
            top: 20px;
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .admin-toggle-btn:hover {
            background: var(--accent-gold);
            color: #000;
        }

        .container {
            max-width: 1000px;
            margin: 25px auto;
            padding: 0 15px;
        }

        /* شبكة عرض الكتب */
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 22px;
        }

        .book-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }

        .book-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-gold);
        }

        .book-img {
            width: 100%;
            height: 270px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
            background-color: #121420;
        }

        .book-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-light);
        }

        .book-price {
            color: var(--accent-gold);
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .btn-gold {
            background: var(--accent-gold);
            color: #0b0d17;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-gold:hover {
            background: var(--accent-gold-hover);
        }

        /* نافذة الدفع */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            z-index: 100;
            overflow-y: auto;
            padding: 20px 10px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            max-width: 500px;
            margin: 50px auto;
            padding: 25px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            left: 20px;
            top: 15px;
            font-size: 26px;
            color: var(--text-gray);
            cursor: pointer;
        }

        /* قارئ الـ PDF مع الحماية والعلامة المائية */
        .reader-view {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 300;
        }

        .pdf-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        .watermark-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.12;
            font-size: 40px;
            color: #fff;
            transform: rotate(-30deg);
            z-index: 301;
        }

        /* لوحة التحكم */
        .admin-panel {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark);
            z-index: 200;
            overflow-y: auto;
            padding: 25px 15px;
        }

        .admin-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .admin-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .admin-box h3 {
            color: var(--accent-gold);
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .form-input {
            width: 100%;
            background: #0f111a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 12px;
            color: #fff;
            margin-bottom: 12px;
            -webkit-user-select: text;
            user-select: text;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #232738;
        }

        .btn-delete {
            background: var(--danger-red);
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body oncontextmenu="return false;" onkeydown="return disableShortcuts(event)">

    <header>
        <button class="admin-toggle-btn" onclick="openAdminModal()"><i class="fas fa-lock"></i> الإدارة</button>
        <div class="header-title"><i class="fas fa-book-open"></i> WonderRead</div>
    </header>

    <div class="container">
        <div class="books-grid" id="booksGrid">
            <div style="text-align: center; grid-column: 1/-1; padding: 40px; color: var(--text-gray);">
                <i class="fas fa-spinner fa-spin fa-2x"></i>
                <p style="margin-top: 10px;">جاري تحميل محتويات المكتبة...</p>
            </div>
        </div>
    </div>

    <!-- نافذة الشراء عبر Binance -->
    <div id="buyModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('buyModal')">&times;</span>
            <h2 id="modalBookTitle" style="color: var(--accent-gold); margin-bottom: 8px;"></h2>
            <p id="modalBookPrice" style="color: #fff; font-size: 18px; margin-bottom: 15px;"></p>
            
            <div style="background: #0f111a; border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; text-align: center; margin-bottom: 15px;">
                <p style="font-size: 13px; color: var(--text-gray); margin-bottom: 5px;">حول القيمة عبر Binance (USDT TRC20 / BEP20) إلى العنوان:</p>
                <div id="walletDisplay" style="font-family: monospace; font-size: 14px; color: var(--accent-gold); word-break: break-all; margin: 10px 0;">
                    جاري جلب المحفظة...
                </div>
                <button class="btn-gold" style="padding: 6px 15px; width: auto; font-size: 12px;" onclick="copyWallet()">نسخ العنوان</button>
            </div>

            <button class="btn-gold" onclick="confirmPaymentAndRead()"><i class="fas fa-check-circle"></i> تم التحويل (فتح الكتاب)</button>
        </div>
    </div>

    <!-- قارئ الكتب PDF المحمي -->
    <div id="readerView" class="reader-view">
        <div class="watermark-overlay">WonderRead Protected</div>
        <button onclick="closeReader()" style="position: absolute; top: 15px; left: 15px; z-index: 302; background: #000; color: #fff; border: 1px solid var(--accent-gold); padding: 8px 16px; border-radius: 6px; cursor: pointer;">إغلاق القارئ</button>
        <iframe id="pdfFrame" class="pdf-frame" src=""></iframe>
    </div>

    <!-- لوحة الإدارة الأصلية -->
    <div id="adminPanel" class="admin-panel">
        <div class="admin-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="color: var(--accent-gold);"><i class="fas fa-cogs"></i> لوحة التحكم</h2>
                <button class="admin-toggle-btn" onclick="closeAdmin()">العودة للتطبيق</button>
            </div>

            <!-- تحديث محفظة بايننس -->
            <div class="admin-box">
                <h3><i class="fab fa-bitcoin"></i> محفظة Binance (USDT)</h3>
                <input type="text" id="adminWalletInput" class="form-input" placeholder="أدخل عنوان محفظة USDT...">
                <button class="btn-gold" onclick="updateBinanceWallet()"><i class="fas fa-save"></i> حفظ المحفظة</button>
            </div>

            <!-- رفع كتاب جديد -->
            <div class="admin-box">
                <h3><i class="fas fa-plus-circle"></i> إضافة كتاب جديد</h3>
                <input type="text" id="newBookTitle" class="form-input" placeholder="عنوان الكتاب...">
                <input type="number" id="newBookPrice" class="form-input" placeholder="السعر بالـ USDT...">
                <input type="text" id="newBookCover" class="form-input" placeholder="رابط صورة الغلاف...">
                <input type="text" id="newBookPdf" class="form-input" placeholder="رابط ملف الـ PDF المباشر...">
                <button class="btn-gold" onclick="addNewBook()"><i class="fas fa-upload"></i> نشر الكتاب</button>
            </div>

            <!-- الكتب المعروضة حالياً وإمكانية حذفها -->
            <div class="admin-box">
                <h3><i class="fas fa-list"></i> إدارة الكتب المعروضة</h3>
                <div id="adminBooksList">جاري الجلب...</div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            projectId: "wonderread-app",
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        let currentActiveBook = null;
        let globalWallet = "TXxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx";

        // منع اختصارات الحفظ والطباعة
        function disableShortcuts(e) {
            if (e.ctrlKey && (e.key === 'p' || e.key === 's' || e.key === 'u')) {
                e.preventDefault();
                return false;
            }
        }

        // جلب عنوان المحفظة
        async function fetchSettings() {
            try {
                const snap = await db.collection('settings').doc('binance').get();
                if (snap.exists && snap.data().wallet) {
                    globalWallet = snap.data().wallet;
                    document.getElementById('adminWalletInput').value = globalWallet;
                }
                document.getElementById('walletDisplay').innerText = globalWallet;
            } catch(e) {
                console.log(e);
            }
        }
        fetchSettings();

        // جلب الكتب وعرضها
        async function loadBooks() {
            const grid = document.getElementById('booksGrid');
            const adminList = document.getElementById('adminBooksList');
            try {
                const snapshot = await db.collection('books').get();
                grid.innerHTML = '';
                adminList.innerHTML = '';

                if (snapshot.empty) {
                    grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-gray);">لا توجد كتب مضافة بعد.</p>';
                    adminList.innerHTML = '<p style="color: var(--text-gray);">لا توجد كتب مضافة.</p>';
                    return;
                }

                snapshot.forEach(doc => {
                    const b = doc.data();
                    grid.innerHTML += `
                        <div class="book-card">
                            <img src="${b.cover || 'https://via.placeholder.com/250x350'}" class="book-img" alt="${b.title}">
                            <div class="book-title">${b.title}</div>
                            <div class="book-price">${b.price} USDT</div>
                            <button class="btn-gold" onclick="openBuyModal('${doc.id}', '${b.title}', '${b.price}', '${b.pdfUrl}')">
                                <i class="fas fa-shopping-cart"></i> شراء وقراءة
                            </button>
                        </div>
                    `;

                    adminList.innerHTML += `
                        <div class="item-row">
                            <span><strong>${b.title}</strong> (${b.price} USDT)</span>
                            <button class="btn-delete" onclick="deleteBook('${doc.id}')"><i class="fas fa-trash"></i> حذف</button>
                        </div>
                    `;
                });
            } catch(e) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--danger-red);">حدث خطأ في تحميل الكتب.</p>';
            }
        }
        loadBooks();

        // فتح نافذة الدفع
        function openBuyModal(id, title, price, pdfUrl) {
            currentActiveBook = { id, title, price, pdfUrl };
            document.getElementById('modalBookTitle').innerText = title;
            document.getElementById('modalBookPrice').innerText = 'المبلغ المطلوب: ' + price + ' USDT';
            document.getElementById('buyModal').style.display = 'block';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function copyWallet() {
            navigator.clipboard.writeText(globalWallet);
            alert('تم نسخ عنوان المحفظة بنجاح!');
        }

        // فتح القارئ بعد الشراء
        function confirmPaymentAndRead() {
            if(!currentActiveBook) return;
            closeModal('buyModal');
            document.getElementById('pdfFrame').src = currentActiveBook.pdfUrl + "#toolbar=0";
            document.getElementById('readerView').style.display = 'block';
        }

        function closeReader() {
            document.getElementById('pdfFrame').src = '';
            document.getElementById('readerView').style.display = 'none';
        }

        // لوحة الإدارة وكلمة المرور
        function openAdminModal() {
            const pass = prompt('أدخل رمز دخول الإدارة:');
            if (pass === "1234") {
                document.getElementById('adminPanel').style.display = 'block';
                fetchSettings();
            } else if (pass !== null) {
                alert('كلمة المرور غير صحيحة!');
            }
        }

        function closeAdmin() {
            document.getElementById('adminPanel').style.display = 'none';
            loadBooks();
        }

        async function updateBinanceWallet() {
            const newW = document.getElementById('adminWalletInput').value.trim();
            if(!newW) return alert('الرجاء كتابة العنوان');
            await db.collection('settings').doc('binance').set({ wallet: newW }, { merge: true });
            globalWallet = newW;
            document.getElementById('walletDisplay').innerText = globalWallet;
            alert('تم حفظ عنوان المحفظة الجديد بنجاح');
        }

        async function addNewBook() {
            const title = document.getElementById('newBookTitle').value.trim();
            const price = document.getElementById('newBookPrice').value.trim();
            const cover = document.getElementById('newBookCover').value.trim();
            const pdf = document.getElementById('newBookPdf').value.trim();

            if (!title || !price || !pdf) {
                return alert('يرجى تعبئة العنوان، السعر، ورابط الـ PDF');
            }

            await db.collection('books').add({
                title: title,
                price: price,
                cover: cover,
                pdfUrl: pdf,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            document.getElementById('newBookTitle').value = '';
            document.getElementById('newBookPrice').value = '';
            document.getElementById('newBookCover').value = '';
            document.getElementById('newBookPdf').value = '';

            alert('تم إضافة الكتاب بنجاح!');
            loadBooks();
        }

        async function deleteBook(id) {
            if(confirm('هل تريد حذف هذا الكتاب نهائياً؟')) {
                await db.collection('books').doc(id).delete();
                loadBooks();
            }
        }

        // فتح الإدارة تلقائياً عند الدخول برابط ?admin=true
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('admin') === 'true') {
                openAdminModal();
            }
        });
    </script>
</body>
</html>
