<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WonderRead - المكتبة الرقمية</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0f111a;
            --card-bg: #1a1d2e;
            --accent-gold: #c5a059;
            --text-light: #f5f6fa;
            --text-gray: #a4b0be;
            --border-color: #2f3542;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        header {
            background: linear-gradient(180deg, #16192b 0%, var(--bg-dark) 100%);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--accent-gold);
            position: relative;
        }

        .header-title {
            font-size: 24px;
            font-weight: 900;
            color: var(--accent-gold);
            letter-spacing: 1px;
        }

        .admin-btn {
            position: absolute;
            left: 20px;
            top: 20px;
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* Books Grid */
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .book-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            transition: transform 0.2s;
        }

        .book-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-gold);
        }

        .book-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .book-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-light);
        }

        .book-price {
            color: var(--accent-gold);
            font-weight: bold;
            margin-bottom: 12px;
        }

        .btn-view {
            background: var(--accent-gold);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        /* Modal Details & Reviews */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            z-index: 100;
            overflow-y: auto;
            padding: 20px 10px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            max-width: 600px;
            margin: 30px auto;
            padding: 25px;
            position: relative;
        }

        .close-modal {
            position: absolute;
            left: 20px;
            top: 15px;
            font-size: 24px;
            color: var(--text-gray);
            cursor: pointer;
        }

        /* Reviews Section */
        .reviews-section {
            margin-top: 25px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .star-rating {
            display: flex;
            gap: 6px;
            font-size: 20px;
            color: var(--accent-gold);
            margin: 10px 0;
            cursor: pointer;
            direction: ltr;
            justify-content: flex-end;
        }

        .review-input, .review-textarea {
            width: 100%;
            background: #121420;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            color: #fff;
            margin-bottom: 10px;
            -webkit-user-select: text;
            user-select: text;
        }

        .review-card {
            background: #141724;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #232738;
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--accent-gold);
            margin-bottom: 5px;
        }

        /* Admin Panel */
        .admin-panel {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark);
            z-index: 200;
            overflow-y: auto;
            padding: 20px;
        }

        .stats-badge {
            background: #232738;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--accent-gold);
            text-align: center;
            margin-bottom: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <header>
        <button class="admin-btn" onclick="openAdmin()"><i class="fas fa-lock"></i> الإدارة</button>
        <div class="header-title"><i class="fas fa-book-open"></i> WonderRead</div>
    </header>

    <div class="container">
        <div class="books-grid" id="booksContainer">
            <!-- تحميل الكتب تلقائياً -->
        </div>
    </div>

    <!-- نافذة تفاصيل الكتاب والتقييمات -->
    <div id="bookModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle" style="color: var(--accent-gold); margin-bottom: 10px;"></h2>
            <p id="modalDesc" style="color: var(--text-gray); font-size: 14px; margin-bottom: 15px;"></p>
            <div id="modalPrice" style="font-weight: bold; margin-bottom: 20px;"></div>

            <!-- قسم كتابة تعليق وتقييم -->
            <div class="reviews-section">
                <h3><i class="fas fa-comments"></i> تقييمات وتعليقات القراء</h3>
                
                <div style="margin-top: 15px;">
                    <input type="text" id="reviewerName" class="review-input" placeholder="اسمك الكريم...">
                    <div class="star-rating" id="starPicker">
                        <i class="far fa-star" onclick="setRating(1)"></i>
                        <i class="far fa-star" onclick="setRating(2)"></i>
                        <i class="far fa-star" onclick="setRating(3)"></i>
                        <i class="far fa-star" onclick="setRating(4)"></i>
                        <i class="far fa-star" onclick="setRating(5)"></i>
                    </div>
                    <textarea id="reviewerComment" class="review-textarea" rows="3" placeholder="أضف انطباعك أو رأيك حول الكتاب..."></textarea>
                    <button class="btn-view" onclick="submitReview()"><i class="fas fa-paper-plane"></i> نشر التقييم</button>
                </div>

                <!-- قائمة التعليقات السابقة -->
                <div id="reviewsList" style="margin-top: 20px;"></div>
            </div>
        </div>
    </div>

    <!-- لوحة التحكم الإدارية -->
    <div id="adminPanel" class="admin-panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="color: var(--accent-gold);"><i class="fas fa-chart-line"></i> لوحة الإدارة والإحصائيات</h2>
            <button class="admin-btn" onclick="closeAdmin()">إغلاق</button>
        </div>

        <!-- عداد الزوار -->
        <div class="stats-badge">
            <i class="fas fa-users" style="color: var(--accent-gold);"></i> 
            إجمالي زيارات التطبيق: <strong id="visitCount" style="color: #fff;">جاري التحميل...</strong>
        </div>

        <h3 style="margin-bottom: 10px;"><i class="fas fa-tasks"></i> إدارة التعليقات الأخيرة</h3>
        <div id="adminReviewsList"></div>
    </div>

    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <script>
        // إعدادات Firebase الحالية لمشروعك
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyReplaceIfConfigDifferent",
            projectId: "wonderread-app",
            firestoreDatabaseUrl: ""
        };

        // تهيئة Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        let currentBookId = null;
        let selectedRating = 5;

        // حماية النصوص من حقن XSS
        function sanitize(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // تسجيل الزيارات تلقائياً
        async function recordVisit() {
            try {
                const statsRef = db.collection('analytics').doc('visitors');
                await statsRef.set({ count: firebase.firestore.FieldValue.increment(1) }, { merge: true });
                const snap = await statsRef.get();
                if (snap.exists) {
                    document.getElementById('visitCount').innerText = snap.data().count;
                }
            } catch(e) { console.log(e); }
        }
        recordVisit();

        // التقييم بالنجوم
        function setRating(val) {
            selectedRating = val;
            const stars = document.getElementById('starPicker').children;
            for(let i=0; i<5; i++) {
                if(i < val) {
                    stars[i].className = 'fas fa-star';
                } else {
                    stars[i].className = 'far fa-star';
                }
            }
        }

        // إرسال التعليق
        async function submitReview() {
            const name = document.getElementById('reviewerName').value.trim();
            const text = document.getElementById('reviewerComment').value.trim();

            if (!name || !text) {
                alert('يرجى كتابة الاسم والتعليق');
                return;
            }

            try {
                await db.collection('reviews').add({
                    bookId: currentBookId,
                    name: sanitize(name),
                    comment: sanitize(text),
                    rating: selectedRating,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                document.getElementById('reviewerName').value = '';
                document.getElementById('reviewerComment').value = '';
                loadReviews(currentBookId);
                alert('تمت إضافة تعليقك بنجاح');
            } catch (err) {
                alert('حدث خطأ في الاتصال، يرجى المحاولة لاحقاً');
            }
        }

        // تحميل التعليقات للكتاب المفتوح
        async function loadReviews(bookId) {
            const list = document.getElementById('reviewsList');
            list.innerHTML = 'جاري تحميل الآراء...';
            
            try {
                const snap = await db.collection('reviews')
                    .where('bookId', '==', bookId)
                    .orderBy('timestamp', 'desc')
                    .get();

                list.innerHTML = '';
                if(snap.empty) {
                    list.innerHTML = '<p style="color: var(--text-gray); font-size: 13px;">كن أول من يقيّم هذا الكتاب!</p>';
                    return;
                }

                snap.forEach(doc => {
                    const data = doc.data();
                    list.innerHTML += `
                        <div class="review-card">
                            <div class="review-header">
                                <strong>${data.name}</strong>
                                <span>${'★'.repeat(data.rating || 5)}</span>
                            </div>
                            <div style="font-size: 13px; color: #ddd;">${data.comment}</div>
                        </div>
                    `;
                });
            } catch(e) {
                list.innerHTML = '<p style="color: var(--text-gray); font-size: 13px;">لا توجد تعليقات بعد.</p>';
            }
        }

        // التحكم بالنوافذ
        function openBookModal(id, title, desc, price) {
            currentBookId = id;
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc;
            document.getElementById('modalPrice').innerText = 'السعر: ' + price;
            setRating(5);
            loadReviews(id);
            document.getElementById('bookModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('bookModal').style.display = 'none';
        }

        function openAdmin() {
            const pass = prompt('أدخل كلمة مرور الإدارة:');
            if(pass === "1234") { // استبدلها برمزك المعتاد
                document.getElementById('adminPanel').style.display = 'block';
                loadAdminReviews();
            } else {
                alert('كلمة المرور غير صحيحة');
            }
        }

        function closeAdmin() {
            document.getElementById('adminPanel').style.display = 'none';
        }

        // حذف التعليقات المخالفة من لوحة الإدارة
        async function loadAdminReviews() {
            const container = document.getElementById('adminReviewsList');
            container.innerHTML = 'جاري التحميل...';
            try {
                const snap = await db.collection('reviews').limit(20).get();
                container.innerHTML = '';
                snap.forEach(doc => {
                    const r = doc.data();
                    container.innerHTML += `
                        <div class="review-card" style="display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <span style="color: var(--accent-gold); font-weight: bold;">${r.name}:</span>
                                <span>${r.comment}</span>
                            </div>
                            <button onclick="deleteReview('${doc.id}')" style="background: #e74c3c; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer;">حذف</button>
                        </div>
                    `;
                });
            } catch(e) { container.innerHTML = 'تعذر الجلب'; }
        }

        async function deleteReview(id) {
            if(confirm('هل تريد حذف هذا التعليق؟')) {
                await db.collection('reviews').doc(id).delete();
                loadAdminReviews();
            }
        }
    </script>
</body>
</html>
