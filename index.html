<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WonderRead | المكتبة الرقمية الفاخرة</title>
    <!-- Tailwind CSS للتحكم بالتصميم والألوان الفاخرة -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: {
                            DEFAULT: '#D4AF37',
                            light: '#F3E5AB',
                            dark: '#AA7C11'
                        },
                        luxuryBg: '#0D0D0D',
                        luxuryCard: '#161616',
                        luxuryBorder: '#2A2A2A'
                    }
                }
            }
        }
    </script>
    <!-- مكتبة الأيقونات Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- مكتبة React و React DOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel لتشغيل كود React JSX مباشرة في المتصفح -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- خطوط عربية ممتازة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0D0D0D;
            color: #FFFFFF;
            user-select: none; /* منع تحديد النصوص لحماية الكتب */
            -webkit-user-select: none;
        }
        /* منع تصوير الشاشة في المتصفحات الحديثة قدر الإمكان */
        @media print {
            body { display: none; }
        }
        /* تخصيص مظهر شريط التمرير */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0D0D0D;
        }
        ::-webkit-scrollbar-thumb {
            background: #D4AF37;
            border-radius: 3px;
        }
    </style>
</head>
<body class="overflow-x-hidden">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- قاعدة بيانات تجريبية مبدئية لـ WonderRead ---
        const INITIAL_BOOKS = [
            {
                id: 1,
                title: "سر الفخامة والريادة المالية",
                author: "د. عبد الرحمن الفايز",
                description: "دليل عملي شامل لبناء الثروة وتطوير العقلية المالية الفاخرة في العصر الحديث. يتناول الكتاب أسرار الاستثمار الناجح وإدارة الأصول بكفاءة عالية، مع نصائح من كبار المستثمرين العالميين.",
                category: "إدارة وأعمال",
                cover_image: "https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&q=80&w=400",
                price: 49.99,
                preview_pages: 5,
                rating: 4.8,
                pages: 280,
                status: "featured"
            },
            {
                id: 2,
                title: "رحلة في غياهب التاريخ العربي",
                author: "أ. سارة الهاشمي",
                description: "دراسة تاريخية معمقة تكشف خفايا الأحداث والتحولات الكبرى في المشرق العربي عبر العصور. يأخذك هذا الكتاب في رحلة مشوقة لاستكشاف الحضارات القديمة والصراعات التي شكلت هويتنا المعاصرة.",
                category: "تاريخ",
                cover_image: "https://images.unsplash.com/photo-1506880018603-83d5b814b5a6?auto=format&fit=crop&q=80&w=400",
                price: 29.99,
                preview_pages: 3,
                rating: 4.5,
                pages: 340,
                status: "new"
            },
            {
                id: 3,
                title: "الذكاء الاصطناعي وصناعة المستقبل",
                author: "م. مازن الشهابي",
                description: "كيف تعيد التكنولوجيا الذكية تشكيل الاقتصاد والوظائف والحياة اليومية؟ نظرة استشرافية دقيقة مدعومة بالبيانات والأمثلة العملية لمواكبة الثورة الصناعية القادمة والفرص المتاحة فيها.",
                category: "تكنولوجيا",
                cover_image: "https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&q=80&w=400",
                price: 39.99,
                preview_pages: 4,
                rating: 4.9,
                pages: 215,
                status: "popular"
            },
            {
                id: 4,
                title: "قواعد السطوة النفسية",
                author: "د. كريم صادق",
                description: "فهم لغة الجسد، والتأثير والإقناع، وكيفية بناء حضور قوي ومهيب في الأوساط الشخصية والمهنية. هذا الكتاب هو دليلك لتطوير مهارات القيادة والسيطرة النفسية الإيجابية.",
                category: "تطوير ذات",
                cover_image: "https://images.unsplash.com/photo-1516979187457-637abb4f9353?auto=format&fit=crop&q=80&w=400",
                price: 19.99,
                preview_pages: 5,
                rating: 4.7,
                pages: 190,
                status: "recommended"
            }
        ];

        const CATEGORIES = ["الكل", "إدارة وأعمال", "تاريخ", "تكنولوجيا", "تطوير ذات", "روايات"];

        function App() {
            // الشاشات: 'home', 'library', 'details', 'reader', 'admin', 'profile'
            const [currentScreen, setCurrentScreen] = useState('home');
            const [books, setBooks] = useState(INITIAL_BOOKS);
            const [selectedBook, setSelectedBook] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('الكل');
            
            // حالة القارئ الإلكتروني
            const [readerBook, setReaderBook] = useState(null);
            const [currentPage, setCurrentPage] = useState(1);
            const [isNightMode, setIsNightMode] = useState(true);
            const [bookmarks, setBookmarks] = useState({}); // { bookId: pageNumber }

            // بيانات المستخدم الحالي
            const [user, setUser] = useState({
                id: "user_01",
                name: "محمد أحمد",
                email: "mohamad@wonderread.com",
                role: "super_admin", // super_admin للوصول الفوري للوحة التحكم
                subscription_type: "عادي", // "شهري", "سنوي", "مدى الحياة"
                purchased_books: [2], // معرفات الكتب التي تم شراؤها بالفعل
                favorites: [1, 4]
            });

            // لوحة التحكم - إضافة كتاب جديد
            const [newBook, setNewBook] = useState({
                title: '', author: '', description: '', category: 'إدارة وأعمال',
                price: '', preview_pages: 5, pages: 150, cover_image: ''
            });

            // بوابات الدفع
            const [paymentModal, setPaymentModal] = useState({ open: false, book: null, type: 'single' });

            useEffect(() => {
                // تفعيل الأيقونات بعد رندرة React
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [currentScreen, selectedBook, readerBook]);

            // التحقق من شراء الكتاب أو وجود اشتراك فعال
            const hasAccess = (book) => {
                if (user.role === "super_admin") return true;
                if (user.subscription_type && user.subscription_type !== "عادي") return true;
                return user.purchased_books.includes(book.id);
            };

            // التعامل مع شراء كتاب أو تفعيل اشتراك
            const handlePurchase = (bookId, planType = 'single') => {
                if (planType === 'single') {
                    setUser(prev => ({
                        ...prev,
                        purchased_books: [...prev.purchased_books, bookId]
                    }));
                    alert("تمت عملية الشراء بنجاح! تم فتح الكتاب بالكامل في مكتبتك.");
                } else {
                    setUser(prev => ({
                        ...prev,
                        subscription_type: planType === 'monthly' ? "شهري" : planType === 'yearly' ? "سنوي" : "مدى الحياة"
                    }));
                    alert("تهانينا! تم تفعيل اشتراكك الفاخر بنجاح، يمكنك الآن قراءة كافة الكتب.");
                }
                setPaymentModal({ open: false, book: null, type: 'single' });
            };

            // إضافة كتاب جديد من لوحة الإدارة
            const handleAddBook = (e) => {
                e.preventDefault();
                if (!newBook.title || !newBook.author || !newBook.price) {
                    alert("يرجى ملء كافة الحقول الأساسية.");
                    return;
                }
                const bookToAdd = {
                    ...newBook,
                    id: books.length + 1,
                    price: parseFloat(newBook.price),
                    preview_pages: parseInt(newBook.preview_pages),
                    pages: parseInt(newBook.pages),
                    cover_image: newBook.cover_image || "https://images.unsplash.com/photo-1543002588-bfa74002ed7e?auto=format&fit=crop&q=80&w=400",
                    rating: 5.0,
                    status: "new"
                };
                setBooks([bookToAdd, ...books]);
                setNewBook({
                    title: '', author: '', description: '', category: 'إدارة وأعمال',
                    price: '', preview_pages: 5, pages: 150, cover_image: ''
                });
                alert("تمت إضافة الكتاب الجديد بنجاح إلى المكتبة!");
            };

            // حذف كتاب
            const handleDeleteBook = (id) => {
                if (confirm("هل أنت متأكد من حذف هذا الكتاب نهائياً من المكتبة؟")) {
                    setBooks(books.filter(b => b.id !== id));
                }
            };

            return (
                <div className="min-h-screen bg-luxuryBg text-white pb-20 select-none">
                    {/* --- شريط التنقل العلوي (Header) --- */}
                    <header className="sticky top-0 z-50 bg-luxuryBg/90 backdrop-blur-md border-b border-luxuryBorder px-4 py-3 flex justify-between items-center max-w-md mx-auto">
                        <div className="flex items-center space-x-2 space-x-reverse" onClick={() => setCurrentScreen('home')}>
                            <div className="w-9 h-9 bg-gradient-to-tr from-gold-dark to-gold rounded-lg flex items-center justify-center shadow-lg cursor-pointer">
                                <span className="font-serif font-black text-black text-xl">W</span>
                            </div>
                            <div>
                                <h1 className="text-lg font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-l from-gold to-white cursor-pointer">WonderRead</h1>
                                <p className="text-[9px] text-gold/80 -mt-1 font-light">المكتبة الرقمية الفاخرة</p>
                            </div>
                        </div>

                        <div className="flex items-center space-x-3 space-x-reverse">
                            {user.role === 'super_admin' && (
                                <button 
                                    onClick={() => setCurrentScreen('admin')}
                                    className={`px-3 py-1.5 rounded-full text-xs font-semibold flex items-center space-x-1 space-x-reverse transition-all ${currentScreen === 'admin' ? 'bg-gold text-black' : 'bg-gold/10 text-gold border border-gold/30'}`}
                                >
                                    <i data-lucide="shield-check" className="w-3.5 h-3.5"></i>
                                    <span>الإدارة العليا</span>
                                </button>
                            )}
                            <button 
                                onClick={() => setCurrentScreen('profile')}
                                className="w-8 h-8 rounded-full border border-gold/30 flex items-center justify-center bg-luxuryCard hover:border-gold transition-colors"
                            >
                                <i data-lucide="user" className="w-4 h-4 text-gold"></i>
                            </button>
                        </div>
                    </header>

                    {/* --- محتوى التطبيق الأساسي (الشاشات) --- */}
                    <main className="max-w-md mx-auto px-4 pt-4">

                        {/* 1. الشاشة الرئيسية */}
                        {currentScreen === 'home' && (
                            <div className="space-y-6">
                                {/* بنر ترويجي فاخر */}
                                <div className="relative rounded-2xl overflow-hidden border border-gold/20 p-6 bg-gradient-to-br from-luxuryCard to-black shadow-2xl">
                                    <div className="absolute top-0 left-0 w-full h-full bg-[radial-gradient(circle_at_top_right,rgba(212,175,55,0.1),transparent_50%)]"></div>
                                    <span className="text-[10px] uppercase font-bold tracking-widest text-gold bg-gold/10 px-2.5 py-1 rounded-full border border-gold/20">عرض حصري</span>
                                    <h2 className="text-xl font-extrabold mt-3 text-white leading-tight">عالم من المعرفة الفاخرة بين يديك</h2>
                                    <p className="text-xs text-gray-400 mt-2 font-light leading-relaxed">اقرأ بداية أي كتاب مجاناً، وافتح آفاق المعرفة الكاملة عبر اشتراكاتنا الراقية.</p>
                                    <button 
                                        onClick={() => setCurrentScreen('library')}
                                        className="mt-4 px-4 py-2 bg-gradient-to-l from-gold-dark to-gold text-black rounded-lg text-xs font-bold flex items-center space-x-1.5 space-x-reverse shadow-lg active:scale-95 transition-transform"
                                    >
                                        <span>استكشف المكتبة</span>
                                        <i data-lucide="arrow-left" className="w-3.5 h-3.5"></i>
                                    </button>
                                </div>

                                {/* الأقسام السريعة */}
                                <div>
                                    <div className="flex justify-between items-center mb-3">
                                        <h3 className="text-sm font-bold border-r-2 border-gold pr-2">تصفح حسب التصنيف</h3>
                                    </div>
                                    <div className="flex space-x-2 space-x-reverse overflow-x-auto pb-2 scrollbar-none">
                                        {CATEGORIES.map(cat => (
                                            <button 
                                                key={cat}
                                                onClick={() => { setSelectedCategory(cat); setCurrentScreen('library'); }}
                                                className="px-4 py-1.5 rounded-full text-xs font-semibold bg-luxuryCard border border-luxuryBorder text-gray-300 whitespace-nowrap active:border-gold transition-colors"
                                            >
                                                {cat}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* كتب مميزة (Featured) */}
                                <div>
                                    <h3 className="text-sm font-bold border-r-2 border-gold pr-2 mb-4">الكتب الأكثر تميزاً</h3>
                                    <div className="grid grid-cols-2 gap-4">
                                        {books.map(book => (
                                            <div 
                                                key={book.id} 
                                                onClick={() => { setSelectedBook(book); setCurrentScreen('details'); }}
                                                className="bg-luxuryCard border border-luxuryBorder rounded-xl overflow-hidden hover:border-gold/40 transition-all cursor-pointer group"
                                            >
                                                <div className="relative aspect-[3/4] overflow-hidden">
                                                    <img src={book.cover_image} alt={book.title} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
                                                    <div className="absolute top-2 left-2 bg-black/80 backdrop-blur-sm px-1.5 py-0.5 rounded text-[9px] font-bold text-gold border border-gold/30">
                                                        {book.price === 0 ? "مجاني" : `${book.price} $`}
                                                    </div>
                                                </div>
                                                <div className="p-3 space-y-1">
                                                    <h4 className="text-xs font-bold text-gray-200 line-clamp-1">{book.title}</h4>
                                                    <p className="text-[10px] text-gray-400 line-clamp-1">{book.author}</p>
                                                    <div className="flex justify-between items-center pt-1 border-t border-luxuryBorder/50">
                                                        <span className="text-[9px] text-gray-500">{book.category}</span>
                                                        <span className="text-[9px] text-gold flex items-center"><i data-lucide="star" className="w-2.5 h-2.5 fill-gold stroke-none ml-0.5"></i>{book.rating}</span>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 2. شاشة المكتبة والبحث */}
                        {currentScreen === 'library' && (
                            <div className="space-y-4">
                                <div className="relative">
                                    <input 
                                        type="text" 
                                        placeholder="ابحث عن عنوان، كاتب، أو قسم..." 
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        className="w-full bg-luxuryCard border border-luxuryBorder rounded-xl py-3 pr-10 pl-4 text-xs focus:border-gold focus:outline-none transition-all"
                                    />
                                    <i data-lucide="search" className="w-4 h-4 text-gray-400 absolute right-3.5 top-3.5"></i>
                                </div>

                                <div className="flex space-x-2 space-x-reverse overflow-x-auto pb-1">
                                    {CATEGORIES.map(cat => (
                                        <button 
                                            key={cat}
                                            onClick={() => setSelectedCategory(cat)}
                                            className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all whitespace-nowrap ${selectedCategory === cat ? 'bg-gold text-black font-bold shadow' : 'bg-luxuryCard border border-luxuryBorder text-gray-400'}`}
                                        >
                                            {cat}
                                        </button>
                                    ))}
                                </div>

                                <div className="grid grid-cols-2 gap-4 pt-2">
                                    {books.filter(b => {
                                        const matchesSearch = b.title.includes(searchQuery) || b.author.includes(searchQuery);
                                        const matchesCat = selectedCategory === 'الكل' || b.category === selectedCategory;
                                        return matchesSearch && matchesCat;
                                    }).map(book => (
                                        <div 
                                            key={book.id}
                                            onClick={() => { setSelectedBook(book); setCurrentScreen('details'); }}
                                            className="bg-luxuryCard border border-luxuryBorder rounded-xl overflow-hidden hover:border-gold/40 transition-all cursor-pointer"
                                        >
                                            <div className="relative aspect-[3/4] overflow-hidden">
                                                <img src={book.cover_image} alt={book.title} className="w-full h-full object-cover" />
                                                {hasAccess(book) && (
                                                    <span className="absolute top-2 right-2 bg-emerald-500/95 text-white text-[8px] font-bold px-1.5 py-0.5 rounded shadow">مفتوح</span>
                                                )}
                                            </div>
                                            <div className="p-3 space-y-1">
                                                <h4 className="text-xs font-bold text-gray-200 line-clamp-1">{book.title}</h4>
                                                <p className="text-[10px] text-gray-400">{book.author}</p>
                                                <div className="flex justify-between items-center pt-1.5 border-t border-luxuryBorder">
                                                    <span className="text-[9px] text-gold font-bold">{book.price} $</span>
                                                    <span className="text-[9px] text-gray-500">{book.pages} صفحة</span>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 3. تفاصيل الكتاب */}
                        {currentScreen === 'details' && selectedBook && (
                            <div className="space-y-6">
                                <button 
                                    onClick={() => setCurrentScreen('library')}
                                    className="flex items-center space-x-1 space-x-reverse text-xs text-gray-400 hover:text-gold"
                                >
                                    <i data-lucide="chevron-right" className="w-4 h-4"></i>
                                    <span>العودة للمكتبة</span>
                                </button>

                                <div className="flex flex-col items-center text-center">
                                    <div className="w-44 aspect-[3/4] rounded-2xl overflow-hidden shadow-2xl border border-gold/30 mb-4">
                                        <img src={selectedBook.cover_image} alt={selectedBook.title} className="w-full h-full object-cover" />
                                    </div>
                                    <h2 className="text-lg font-black text-white">{selectedBook.title}</h2>
                                    <p className="text-xs text-gold mt-1">{selectedBook.author}</p>
                                    
                                    <div className="flex items-center space-x-4 space-x-reverse mt-4 bg-luxuryCard px-4 py-2 rounded-xl border border-luxuryBorder">
                                        <div className="text-center px-2">
                                            <span className="block text-[10px] text-gray-400">التصنيف</span>
                                            <span className="text-xs font-bold text-white">{selectedBook.category}</span>
                                        </div>
                                        <div className="h-6 w-px bg-luxuryBorder"></div>
                                        <div className="text-center px-2">
                                            <span className="block text-[10px] text-gray-400">الصفحات</span>
                                            <span className="text-xs font-bold text-white">{selectedBook.pages}</span>
                                        </div>
                                        <div className="h-6 w-px bg-luxuryBorder"></div>
                                        <div className="text-center px-2">
                                            <span className="block text-[10px] text-gray-400">التقييم</span>
                                            <span className="text-xs font-bold text-gold flex items-center justify-center">
                                                <i data-lucide="star" className="w-3 h-3 fill-gold stroke-none ml-1"></i>
                                                {selectedBook.rating}
                                            </span>
                                        </div>
                                    </div>
                                </div>

                                <div>
                                    <h3 className="text-xs font-bold text-gold mb-1">نبذة عن الكتاب:</h3>
                                    <p className="text-xs text-gray-300 leading-relaxed font-light">{selectedBook.description}</p>
                                </div>

                                <div className="space-y-3 pt-2">
                                    {hasAccess(selectedBook) ? (
                                        <button 
                                            onClick={() => { setReaderBook(selectedBook); setCurrentPage(1); setCurrentScreen('reader'); }}
                                            className="w-full py-3.5 bg-gradient-to-l from-emerald-600 to-emerald-500 hover:from-emerald-700 text-white rounded-xl font-bold text-xs flex justify-center items-center space-x-2 space-x-reverse shadow-lg"
                                        >
                                            <i data-lucide="book-open" className="w-4 h-4"></i>
                                            <span>ابدأ القراءة الفورية (نسخة كاملة)</span>
                                        </button>
                                    ) : (
                                        <div className="grid grid-cols-2 gap-3">
                                            <button 
                                                onClick={() => { setReaderBook(selectedBook); setCurrentPage(1); setCurrentScreen('reader'); }}
                                                className="py-3 bg-luxuryCard border border-gold/40 hover:border-gold text-gold rounded-xl font-bold text-xs flex justify-center items-center space-x-2 space-x-reverse"
                                            >
                                                <i data-lucide="book-open-check" className="w-4 h-4"></i>
                                                <span>قراءة عينة ({selectedBook.preview_pages} صفحات)</span>
                                            </button>
                                            <button 
                                                onClick={() => setPaymentModal({ open: true, book: selectedBook, type: 'single' })}
                                                className="py-3 bg-gradient-to-l from-gold-dark to-gold text-black rounded-xl font-bold text-xs flex justify-center items-center space-x-2 space-x-reverse shadow-lg"
                                            >
                                                <i data-lucide="shopping-bag" className="w-4 h-4"></i>
                                                <span>شراء الآن بـ {selectedBook.price} $</span>
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* 4. قارئ الـ PDF المتكامل والآمن */}
                        {currentScreen === 'reader' && readerBook && (
                            <div className={`space-y-4 ${isNightMode ? 'bg-luxuryBg text-gray-100' : 'bg-white text-gray-900'} p-4 rounded-2xl min-h-[500px] flex flex-col justify-between border border-luxuryBorder relative overflow-hidden`}>
                                
                                {/* حماية العلامة المائية الديناميكية */}
                                <div className="absolute inset-0 pointer-events-none z-10 flex flex-wrap items-center justify-center opacity-[0.03] select-none">
                                    {Array(15).fill(`${user.name} | ${user.email} | محمية ومسجلة`).map((text, idx) => (
                                        <span key={idx} className="text-xs font-bold text-red-500 rotate-12 m-8 whitespace-nowrap">{text}</span>
                                    ))}
                                </div>

                                <div className="flex justify-between items-center border-b border-luxuryBorder pb-3">
                                    <div className="flex items-center space-x-2 space-x-reverse">
                                        <button onClick={() => setCurrentScreen('details')} className="p-1.5 hover:bg-luxuryCard rounded-lg">
                                            <i data-lucide="arrow-right" className="w-5 h-5"></i>
                                        </button>
                                        <div>
                                            <h4 className="text-xs font-bold line-clamp-1">{readerBook.title}</h4>
                                            <p className="text-[9px] text-gray-400">الصفحة {currentPage} من {readerBook.pages}</p>
                                        </div>
                                    </div>

                                    <div className="flex items-center space-x-2 space-x-reverse">
                                        <button onClick={() => setIsNightMode(!isNightMode)} className="p-1.5 hover:bg-luxuryCard rounded-lg">
                                            <i data-lucide={isNightMode ? "sun" : "moon"} className="w-4 h-4 text-gold"></i>
                                        </button>
                                        <button 
                                            onClick={() => {
                                                setBookmarks(prev => ({ ...prev, [readerBook.id]: currentPage }));
                                                alert(`تم حفظ الإشارة المرجعية عند الصفحة ${currentPage}!`);
                                            }}
                                            className="p-1.5 hover:bg-luxuryCard rounded-lg"
                                        >
                                            <i data-lucide="bookmark" className={`w-4 h-4 ${bookmarks[readerBook.id] === currentPage ? 'fill-gold text-gold' : 'text-gray-400'}`}></i>
                                        </button>
                                    </div>
                                </div>

                                {/* محتوى الصفحة المشفرة */}
                                <div className="flex-grow flex flex-col justify-center items-center py-6 relative">
                                    {currentPage > readerBook.preview_pages && !hasAccess(readerBook) ? (
                                        <div className="text-center max-w-xs space-y-4 animate-fade-in">
                                            <div className="w-16 h-16 bg-gold/10 border border-gold/40 rounded-full flex items-center justify-center mx-auto mb-2">
                                                <i data-lucide="lock" className="w-8 h-8 text-gold"></i>
                                            </div>
                                            <h3 className="text-sm font-extrabold text-gold">لقد وصلت لنهاية العينة المجانية</h3>
                                            <p className="text-[11px] text-gray-400 leading-relaxed">افتح الكتاب بالكامل لتتابع الاستمتاع بالقراءة وتنمية مهاراتك الفكرية.</p>
                                            <button 
                                                onClick={() => setPaymentModal({ open: true, book: readerBook, type: 'single' })}
                                                className="w-full py-3 bg-gradient-to-l from-gold-dark to-gold text-black rounded-lg text-xs font-bold shadow-lg"
                                            >
                                                شراء الكتاب الكامل
                                            </button>
                                            <button 
                                                onClick={() => setPaymentModal({ open: true, book: readerBook, type: 'all' })}
                                                className="w-full py-2 bg-luxuryCard border border-luxuryBorder text-gray-300 rounded-lg text-[10px]"
                                            >
                                                اشترك في الباقات الفاخرة
                                            </button>
                                        </div>
                                    ) : (
                                        <div className="w-full space-y-4 max-w-sm px-2 text-justify select-none">
                                            <h2 className="text-center font-bold text-gold text-xs tracking-wider mb-4 border-b border-gold/10 pb-2">الباب الأول: البدايات وصناعة الفرص ({currentPage})</h2>
                                            <p className="text-[11px] leading-loose font-normal">
                                                إن البدايات الحقيقية تبدأ دوماً من داخل عقل القارئ والباحث، وليست من الظروف المحيطة به. عندما تتصفح هذه المعارف والكلمات، فأن تضع حجر الأساس لمستقبل مختلف ومترع بالنجاح المالي والفكري. الاستثمار الحقيقي هو ما تضعه في وعيك، لأنه سينعكس على كل قراراتك القادمة في إدارة شؤونك الحياتية.
                                            </p>
                                            <p className="text-[11.5px] leading-loose font-normal">
                                                ولعل التحدي الأكبر الذي يواجه الطامحين في عصرنا الحالي ليس شح المعلومات، بل غربلتها واختيار الأكثر قيمة منها. هنا يأتي دور WonderRead في توفير المحتوى الأرقى جودة لمن لا يقبل إلا بالقمم.
                                            </p>
                                        </div>
                                    )}
                                </div>

                                {/* أزرار الانتقال */}
                                <div className="flex justify-between items-center border-t border-luxuryBorder pt-3 z-20">
                                    <button 
                                        onClick={() => currentPage > 1 && setCurrentPage(currentPage - 1)}
                                        disabled={currentPage === 1}
                                        className="px-4 py-2 bg-luxuryCard border border-luxuryBorder rounded-lg text-xs disabled:opacity-30 disabled:pointer-events-none flex items-center space-x-1 space-x-reverse"
                                    >
                                        <i data-lucide="chevron-right" className="w-4 h-4"></i>
                                        <span>السابق</span>
                                    </button>

                                    <button 
                                        onClick={() => currentPage <= readerBook.preview_pages && setCurrentPage(currentPage + 1)}
                                        className="px-4 py-2 bg-luxuryCard border border-luxuryBorder rounded-lg text-xs flex items-center space-x-1"
                                    >
                                        <span>التالي</span>
                                        <i data-lucide="chevron-left" className="w-4 h-4"></i>
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* 5. لوحة التحكم - الإدارة العليا (Super Admin) */}
                        {currentScreen === 'admin' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-base font-extrabold border-r-2 border-gold pr-2 text-gold">لوحة الإدارة العليا (Super Admin)</h2>
                                    <span className="text-[10px] bg-red-950 text-red-400 px-2.5 py-1 rounded-full border border-red-500/20 font-bold">نشط</span>
                                </div>

                                {/* بطاقات إحصائيات سريعة */}
                                <div className="grid grid-cols-2 gap-3">
                                    <div className="bg-luxuryCard p-3 rounded-xl border border-luxuryBorder">
                                        <span className="text-[10px] text-gray-400 block">إجمالي الكتب</span>
                                        <span className="text-base font-black text-gold">{books.length} كُتب</span>
                                    </div>
                                    <div className="bg-luxuryCard p-3 rounded-xl border border-luxuryBorder">
                                        <span className="text-[10px] text-gray-400 block">المستخدمين النشطين</span>
                                        <span className="text-base font-black text-gold">342 قارئ</span>
                                    </div>
                                    <div className="bg-luxuryCard p-3 rounded-xl border border-luxuryBorder">
                                        <span className="text-[10px] text-gray-400 block">مبيعات اليوم</span>
                                        <span className="text-base font-black text-emerald-400">145.50 $</span>
                                    </div>
                                    <div className="bg-luxuryCard p-3 rounded-xl border border-luxuryBorder">
                                        <span className="text-[10px] text-gray-400 block">المشتركون بالباقات</span>
                                        <span className="text-base font-black text-gold">89 عضو</span>
                                    </div>
                                </div>

                                {/* إضافة كتاب جديد */}
                                <form onSubmit={handleAddBook} className="bg-luxuryCard p-4 rounded-2xl border border-luxuryBorder space-y-4">
                                    <h3 className="text-xs font-bold text-gold flex items-center space-x-2 space-x-reverse border-b border-luxuryBorder pb-2">
                                        <i data-lucide="plus" className="w-4 h-4"></i>
                                        <span>إضافة كتاب جديد إلى المكتبة</span>
                                    </h3>

                                    <div className="space-y-3 text-xs">
                                        <div>
                                            <label className="block text-gray-400 mb-1">عنوان الكتاب *</label>
                                            <input type="text" placeholder="مثال: أسرار القيادة والنجاح" value={newBook.title} onChange={e => setNewBook({...newBook, title: e.target.value})} className="w-full bg-luxuryBg border border-luxuryBorder rounded-lg p-2.5 text-white focus:border-gold focus:outline-none" required />
                                        </div>
                                        <div>
                                            <label className="block text-gray-400 mb-1">اسم الكاتب *</label>
                                            <input type="text" placeholder="مثال: د. ماهر أحمد" value={newBook.author} onChange={e => setNewBook({...newBook, author: e.target.value})} className="w-full bg-luxuryBg border border-luxuryBorder rounded-lg p-2.5 text-white focus:border-gold" required />
                                        </div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="block text-gray-400 mb-1">السعر ($) *</label>
                                                <input type="number" step="0.01" placeholder="مثال: 19.99" value={newBook.price} onChange={e => setNewBook({...newBook, price: e.target.value})} className="w-full bg-luxuryBg border border-luxuryBorder rounded-lg p-2.5 text-white focus:border-gold" required />
                                            </div>
                                            <div>
                                                <label className="block text-gray-400 mb-1">القسم</label>
                                                <select value={newBook.category} onChange={e => setNewBook({...newBook, category: e.target.value})} className="w-full bg-luxuryBg border border-luxuryBorder rounded-lg p-2.5 text-white focus:border-gold">
                                                    {CATEGORIES.slice(1).map(cat => <option key={cat} value={cat}>{cat}</option>)}
                                                </select>
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="block text-gray-400 mb-1">صفحات العينة المجانية</label>
                                                <input type="number" value={newBook.preview_pages} onChange={e => setNewBook({...newBook, preview_pages: e.target.value})} className="w-full bg-luxuryBg border border-luxuryBorder rounded-lg p-2.5 text-white focus:border-gold" />
                                            </div>
                                            <div>
                                                <label className="block text-gray-400 mb-1">إجمالي الصفحات</label>
                                                <input type="number" value={newBook.pages} onChange={e => setNewBook({...newBook, pages: e.target.value})} className="w-full bg-luxuryBg border border-luxuryBorder rounded-lg p-2.5 text-white" />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-gray-400 mb-1">رابط صورة الغلاف (اختياري)</label>
                                            <input type="url" placeholder="https://example.com/cover.jpg" value={newBook.cover_image} onChange={e => setNewBook({...newBook, cover_image: e.target.value})} className="w-full bg-luxuryBg border border-luxuryBorder rounded-lg p-2.5 text-white" />
                                        </div>
                                        <div>
                                            <label className="block text-gray-400 mb-1">الوصف والنبذة</label>
                                            <textarea rows="3" placeholder="اكتب خلاصة ونبذة عن الكتاب..." value={newBook.description} onChange={e => setNewBook({...newBook, description: e.target.value})} className="w-full bg-luxuryBg border border-luxuryBorder rounded-lg p-2.5 text-white focus:border-gold focus:outline-none"></textarea>
                                        </div>
                                    </div>

                                    <button type="submit" className="w-full py-3 bg-gradient-to-l from-gold-dark to-gold text-black rounded-lg font-bold text-xs">
                                        تأكيد الإضافة للمكتبة
                                    </button>
                                </form>

                                {/* إدارة الكتب الحالية */}
                                <div className="space-y-3">
                                    <h3 className="text-xs font-bold text-gold pr-2 border-r border-gold">إدارة الكتب الحالية</h3>
                                    {books.map(book => (
                                        <div key={book.id} className="bg-luxuryCard p-3 rounded-xl border border-luxuryBorder flex justify-between items-center">
                                            <div className="flex items-center space-x-3 space-x-reverse">
                                                <img src={book.cover_image} alt={book.title} className="w-10 h-14 object-cover rounded" />
                                                <div>
                                                    <h4 className="text-xs font-bold text-white line-clamp-1">{book.title}</h4>
                                                    <p className="text-[10px] text-gray-400">{book.author} | {book.price} $</p>
                                                </div>
                                            </div>
                                            <button 
                                                onClick={() => handleDeleteBook(book.id)}
                                                className="p-2 hover:bg-red-950/40 rounded-lg text-red-500 hover:text-red-400"
                                            >
                                                <i data-lucide="trash-2" className="w-4.5 h-4.5"></i>
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 6. الملف الشخصي */}
                        {currentScreen === 'profile' && (
                            <div className="space-y-6">
                                <div className="bg-luxuryCard border border-luxuryBorder rounded-2xl p-6 text-center space-y-3 relative overflow-hidden">
                                    <div className="absolute top-0 right-0 w-24 h-24 bg-gold/5 rounded-full blur-2xl"></div>
                                    <div className="w-16 h-16 bg-gold/10 border border-gold/30 rounded-full flex items-center justify-center mx-auto shadow-inner">
                                        <i data-lucide="user" className="w-8 h-8 text-gold"></i>
                                    </div>
                                    <div>
                                        <h2 className="text-base font-extrabold">{user.name}</h2>
                                        <p className="text-xs text-gray-400 mt-1">{user.email}</p>
                                    </div>
                                    <div className="inline-block bg-gold/15 text-gold border border-gold/30 text-[10px] px-3 py-1 rounded-full font-bold">
                                        نوع الاشتراك: {user.subscription_type === "عادي" ? "باقة مجانية عادية" : `عضوية فاخرة (${user.subscription_type})`}
                                    </div>
                                </div>

                                <div className="space-y-4">
                                    <h3 className="text-xs font-bold text-gold border-r-2 border-gold pr-2">الكتب التي قمت باقتنائها</h3>
                                    <div className="grid grid-cols-2 gap-4">
                                        {books.filter(b => hasAccess(b)).map(book => (
                                            <div 
                                                key={book.id} 
                                                onClick={() => { setSelectedBook(book); setCurrentScreen('details'); }}
                                                className="bg-luxuryCard border border-luxuryBorder rounded-xl overflow-hidden hover:border-gold/40 transition-all cursor-pointer"
                                            >
                                                <div className="relative aspect-[3/4] overflow-hidden">
                                                    <img src={book.cover_image} alt={book.title} className="w-full h-full object-cover" />
                                                </div>
                                                <div className="p-3">
                                                    <h4 className="text-xs font-bold text-gray-200 line-clamp-1">{book.title}</h4>
                                                    <span className="text-[9px] text-emerald-400 font-bold block mt-1">جاهز للقراءة</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                    </main>

                    {/* --- شريط التبويبات السفلي النشط (Bottom Navigation) --- */}
                    <nav className="fixed bottom-0 left-0 right-0 bg-luxuryBg/95 backdrop-blur-md border-t border-luxuryBorder py-2.5 px-6 flex justify-around items-center max-w-md mx-auto z-40">
                        <button 
                            onClick={() => setCurrentScreen('home')}
                            className={`flex flex-col items-center space-y-1 transition-colors ${currentScreen === 'home' ? 'text-gold' : 'text-gray-500'}`}
                        >
                            <i data-lucide="home" className="w-5.5 h-5.5"></i>
                            <span className="text-[9px] font-bold">الرئيسية</span>
                        </button>

                        <button 
                            onClick={() => { setSelectedCategory('الكل'); setCurrentScreen('library'); }}
                            className={`flex flex-col items-center space-y-1 transition-colors ${currentScreen === 'library' ? 'text-gold' : 'text-gray-500'}`}
                        >
                            <i data-lucide="library" className="w-5.5 h-5.5"></i>
                            <span className="text-[9px] font-bold">المكتبة</span>
                        </button>

                        <button 
                            onClick={() => setCurrentScreen('profile')}
                            className={`flex flex-col items-center space-y-1 transition-colors ${currentScreen === 'profile' ? 'text-gold' : 'text-gray-500'}`}
                        >
                            <i data-lucide="bookmark" className="w-5.5 h-5.5"></i>
                            <span className="text-[9px] font-bold">المقتنيات</span>
                        </button>
                    </nav>

                    {/* --- نافذة الدفع الفاخر والتفاعلي --- */}
                    {paymentModal.open && paymentModal.book && (
                        <div className="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4 max-w-md mx-auto transition-opacity duration-300">
                            <div className="bg-luxuryCard border border-gold/30 rounded-2xl w-full max-w-sm p-6 space-y-4 shadow-2xl relative">
                                <button 
                                    onClick={() => setPaymentModal({ open: false, book: null, type: 'single' })}
                                    className="absolute top-4 right-4 text-gray-400 hover:text-white"
                                >
                                    <i data-lucide="x" className="w-5 h-5"></i>
                                </button>

                                <div className="text-center space-y-2">
                                    <div className="w-12 h-12 bg-gold/10 border border-gold/40 rounded-full flex items-center justify-center mx-auto mb-2">
                                        <i data-lucide="shield-check" className="w-6 h-6 text-gold"></i>
                                    </div>
                                    <h3 className="text-base font-extrabold text-white">إتمام عملية الشراء الفاخرة</h3>
                                    <p className="text-xs text-gray-400">لقد اخترت تفعيل كتاب "{paymentModal.book.title}"</p>
                                </div>

                                <div className="bg-luxuryBg border border-luxuryBorder p-4 rounded-xl space-y-2">
                                    <div className="flex justify-between text-xs">
                                        <span className="text-gray-400">سعر الكتاب الفردي:</span>
                                        <span className="font-bold text-gold">{paymentModal.book.price} $</span>
                                    </div>
                                    <div className="h-px bg-luxuryBorder"></div>
                                    <div className="flex justify-between text-xs font-bold text-white">
                                        <span>إجمالي المبلغ المستحق:</span>
                                        <span>{paymentModal.book.price} $</span>
                                    </div>
                                </div>

                                <div className="space-y-3">
                                    <button 
                                        onClick={() => handlePurchase(paymentModal.book.id, 'single')}
                                        className="w-full py-3 bg-gradient-to-l from-gold-dark to-gold text-black text-xs font-bold rounded-xl shadow-lg active:scale-95 transition-transform flex items-center justify-center space-x-2 space-x-reverse"
                                    >
                                        <i data-lucide="credit-card" className="w-4.5 h-4.5"></i>
                                        <span>شراء الآن وآمن عبر بوابة Stripe / PayPal</span>
                                    </button>

                                    <button 
                                        onClick={() => handlePurchase(paymentModal.book.id, 'monthly')}
                                        className="w-full py-2.5 bg-luxuryBg border border-gold/45 text-gold text-xs font-semibold rounded-xl flex items-center justify-center space-x-2 space-x-reverse"
                                    >
                                        <i data-lucide="sparkles" className="w-4 h-4"></i>
                                        <span>تفعيل باقة الاشتراك الشاملة (9.99$/الشهر)</span>
                                    </button>
                                </div>

                                <p className="text-[10px] text-gray-500 text-center">عمليات الدفع والتنزيلات كلها محمية ومؤمنة بالكامل 100%.</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
