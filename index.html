<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WonderRead | المكتبة الرقمية المتكاملة</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: { DEFAULT: '#D4AF37', light: '#F3E5AB', dark: '#AA7C11' },
                        luxuryBg: '#0D0D0D',
                        luxuryCard: '#161616',
                        luxuryBorder: '#2A2A2A'
                    }
                }
            }
        }
    </script>
    <!-- Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0D0D0D;
            color: #FFFFFF;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
        }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 4px; }
    </style>
</head>
<body class="bg-[#0D0D0D] text-white pb-20">

    <!-- الترويسة العلوية -->
    <header class="sticky top-0 z-40 bg-[#0D0D0D]/95 backdrop-blur-md border-b border-luxuryBorder px-4 py-3 flex justify-between items-center max-w-md mx-auto">
        <div class="flex items-center space-x-2 space-x-reverse cursor-pointer" onclick="showScreen('home')">
            <div class="w-9 h-9 bg-gradient-to-tr from-gold-dark to-gold rounded-lg flex items-center justify-center shadow-lg font-serif font-black text-black text-xl">
                W
            </div>
            <div>
                <h1 class="text-lg font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-l from-gold to-white">WonderRead</h1>
                <p id="cloud-status" class="text-[9px] text-gold/80 -mt-1 font-light">المكتبة الرقمية الفاخرة</p>
            </div>
        </div>

        <div class="flex items-center space-x-2 space-x-reverse">
            <button onclick="openComplaintModal()" title="إرسال شكوى أو مقترح" class="w-8 h-8 rounded-full bg-red-950/40 border border-red-500/40 flex items-center justify-center text-red-400 text-xs font-bold">
                ⚠️
            </button>
            <button onclick="showScreen('admin')" class="px-3 py-1.5 rounded-full text-xs font-semibold bg-gold/10 text-gold border border-gold/30">
                الإدارة
            </button>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main id="app-container" class="max-w-md mx-auto px-4 pt-4"></main>

    <!-- شريط التنقل السفلي -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#0D0D0D]/95 border-t border-luxuryBorder py-2.5 px-6 flex justify-around items-center max-w-md mx-auto z-40 text-xs">
        <button onclick="showScreen('home')" id="nav-home" class="font-bold text-gold">الرئيسية</button>
        <button onclick="showScreen('library')" id="nav-library" class="font-bold text-gray-500">المكتبة</button>
        <button onclick="showScreen('admin')" id="nav-admin" class="font-bold text-gray-500">الإدارة</button>
    </nav>

    <!-- نافذة الشكاوى المنبثقة -->
    <div id="modal-complaint" class="fixed inset-0 bg-black/85 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-luxuryCard border border-luxuryBorder p-5 rounded-2xl w-full max-w-sm space-y-4">
            <div class="flex justify-between items-center border-b border-luxuryBorder pb-2">
                <h3 class="text-sm font-bold text-gold">⚠️ صندوق الشكاوى والمقترحات</h3>
                <button onclick="closeComplaintModal()" class="text-gray-400 text-sm">✕</button>
            </div>
            <form onsubmit="submitComplaint(event)" class="space-y-3 text-xs">
                <div>
                    <label class="text-gray-400 block mb-1">اسمك أو وسيلة تواصل (اختياري)</label>
                    <input type="text" id="comp-sender" class="w-full bg-luxuryBg border border-luxuryBorder rounded-lg p-2 text-white" placeholder="الاسم أو الهاتف">
                </div>
                <div>
                    <label class="text-gray-400 block mb-1">تفاصيل الشكوى أو الملاحظة *</label>
                    <textarea id="comp-msg" rows="3" required class="w-full bg-luxuryBg border border-luxuryBorder rounded-lg p-2 text-white" placeholder="اكتب شكواك بوضوح..."></textarea>
                </div>
                <button type="submit" class="w-full py-2.5 bg-red-800 hover:bg-red-700 text-white font-bold rounded-lg">إرسال الشكوى للإدارة</button>
            </form>
        </div>
    </div>

    <!-- نافذة الدفع عبر بايننس -->
    <div id="modal-payment" class="fixed inset-0 bg-black/85 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-luxuryCard border border-luxuryBorder p-5 rounded-2xl w-full max-w-sm space-y-4 text-xs">
            <div class="flex justify-between items-center border-b border-luxuryBorder pb-2">
                <h3 class="text-sm font-bold text-yellow-500">🟡 الدفع عبر محفظة بايننس</h3>
                <button onclick="closePaymentModal()" class="text-gray-400 text-sm">✕</button>
            </div>
            <p id="pay-book-title" class="text-gray-300"></p>
            <div class="bg-luxuryBg p-3 rounded-xl border border-luxuryBorder space-y-1.5">
                <div class="flex justify-between text-gray-400">
                    <span>المبلغ المطلوب:</span>
                    <span id="pay-book-price" class="text-yellow-400 font-bold"></span>
                </div>
                <div class="flex justify-between text-gray-400">
                    <span>الشبكة المعتمدة:</span>
                    <span class="text-white font-bold">BNB Smart Chain (BEP20) / Tron</span>
                </div>
            </div>
            <div>
                <label class="text-gray-400 block mb-1">عنوان المحفظة (اضغط للنسخ):</label>
                <div onclick="copyAddress()" class="bg-black/60 p-2.5 rounded-lg border border-yellow-500/30 font-mono break-all text-yellow-300 cursor-pointer flex justify-between items-center text-[10px]">
                    <span id="binance-addr">0x71c2b5e1974780447385012586f189f7831fbe61</span>
                    <span class="bg-yellow-500/20 text-yellow-400 px-1.5 py-0.5 rounded ml-1 text-[9px]">نسخ</span>
                </div>
            </div>
            <div>
                <label class="text-gray-400 block mb-1">رقم أو رمز العملية (TXID / Hash):</label>
                <input type="text" id="pay-txid" placeholder="الصق رقم العملية بعد التحويل" class="w-full bg-luxuryBg border border-luxuryBorder rounded-lg p-2 text-white text-[11px]">
            </div>
            <button onclick="confirmPayment()" class="w-full py-2.5 bg-gradient-to-l from-yellow-600 to-yellow-500 text-black font-bold rounded-lg">تأكيد إرسال التحويل</button>
        </div>
    </div>

    <!-- السكربت المباشر الفائق -->
    <script>
        const BINANCE_ADDR = "0x71c2b5e1974780447385012586f189f7831fbe61";
        const CATEGORIES = ["الكل", "إدارة وأعمال", "تاريخ", "تكنولوجيا", "تطوير ذات", "روايات"];
        const BANNED_WORDS = ["شتم", "سب", "حقير", "سافل", "لعنة", "نصاب", "احتيال", "كلب", "حمار", "غبي", "تافه", "منحط", "قذر"];

        const INITIAL_BOOKS = [
            {
                id: "b1",
                title: "سر الفخامة والريادة المالية",
                author: "د. عبد الرحمن الفايز",
                description: "دليل عملي شامل لبناء الثروة وتطوير العقلية المالية الفاخرة وإدارة الأصول بكفاءة.",
                category: "إدارة وأعمال",
                cover_image: "https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&q=80&w=400",
                pdf_url: "",
                price: 15.00,
                pages: 280
            }
        ];

        let books = JSON.parse(localStorage.getItem('wonderread_books') || 'null') || INITIAL_BOOKS;
        let comments = JSON.parse(localStorage.getItem('wonderread_comments') || '{}');
        let currentScreen = 'home';
        let selectedBook = null;
        let activePayingBook = null;
        let selectedCategory = 'الكل';
        let searchQuery = '';
        let uploadedCoverBase64 = '';
        let db = null;
        let isCloudActive = false;

        function initFirebase() {
            try {
                const firebaseConfig = {
                    apiKey: "AIzaSyB5y-QiubQ6X-Cu0orHAT58S1uGpglnxbc",
                    authDomain: "wonderread-app-e760b.firebaseapp.com",
                    projectId: "wonderread-app-e760b",
                    storageBucket: "wonderread-app-e760b.firebasestorage.app"
                };
                if (window.firebase) {
                    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                    db = firebase.firestore();
                    syncWithCloud();
                }
            } catch (e) {
                console.warn("السحابة تعمل محلياً:", e);
            }
        }

        function syncWithCloud() {
            if (!db) return;
            db.collection("books").onSnapshot(snap => {
                if (!snap.empty) {
                    books = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    localStorage.setItem('wonderread_books', JSON.stringify(books));
                    isCloudActive = true;
                    const statusEl = document.getElementById('cloud-status');
                    if (statusEl) statusEl.innerText = "سحابي متصل ✓";
                    render();
                } else {
                    INITIAL_BOOKS.forEach(b => db.collection("books").add(b));
                }
            }, () => {
                const statusEl = document.getElementById('cloud-status');
                if (statusEl) statusEl.innerText = "المكتبة الرقمية (محلي)";
            });

            db.collection("comments").onSnapshot(snap => {
                const cMap = {};
                snap.forEach(doc => {
                    const d = doc.data();
                    if (!cMap[d.bookId]) cMap[d.bookId] = [];
                    cMap[d.bookId].push({ id: doc.id, ...d });
                });
                comments = cMap;
                localStorage.setItem('wonderread_comments', JSON.stringify(comments));
                if (currentScreen === 'details') render();
            });
        }

        function compressImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = e => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > 450) { h = Math.round((h * 450) / w); w = 450; }
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.onerror = reject;
                };
                reader.onerror = reject;
            });
        }

        async function handleImageFile(e) {
            const file = e.target.files[0];
            if (file) {
                try {
                    uploadedCoverBase64 = await compressImage(file);
                    const prev = document.getElementById('cover-preview-img');
                    if (prev) {
                        prev.src = uploadedCoverBase64;
                        prev.classList.remove('hidden');
                    }
                } catch (err) {
                    alert("تعذر قراءة الصورة، يرجى اختيار ملف صورة صالح.");
                }
            }
        }

        function showScreen(screen, bookId = null) {
            currentScreen = screen;
            if (bookId) selectedBook = books.find(b => b.id === bookId);
            
            ['home', 'library', 'admin'].forEach(s => {
                const el = document.getElementById('nav-' + s);
                if (el) el.className = (s === screen) ? "font-bold text-gold" : "font-bold text-gray-500";
            });
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function render() {
            const container = document.getElementById('app-container');
            if (!container) return;

            if (currentScreen === 'home') {
                container.innerHTML = `
                    <div class="space-y-6">
                        <div class="rounded-2xl border border-gold/20 p-5 bg-gradient-to-br from-luxuryCard to-black shadow-xl">
                            <span class="text-[10px] font-bold text-gold bg-gold/10 px-2.5 py-1 rounded-full border border-gold/20">منصة القراءة الحرة</span>
                            <h2 class="text-xl font-extrabold mt-3 text-white leading-tight">عالم من المعرفة الفاخرة بين يديك</h2>
                            <p class="text-xs text-gray-400 mt-2 font-light">تصفح الكتب واقرأ التعليقات وتفاعل مع نخبة القراء بأمان تام.</p>
                            <button onclick="showScreen('library')" class="mt-4 px-4 py-2 bg-gradient-to-l from-gold-dark to-gold text-black rounded-lg text-xs font-bold shadow-lg">استكشف المكتبة الآن</button>
                        </div>

                        <div>
                            <h3 class="text-sm font-bold border-r-2 border-gold pr-2 mb-3">التصنيفات</h3>
                            <div class="flex space-x-2 space-x-reverse overflow-x-auto pb-1">
                                ${CATEGORIES.map(cat => `
                                    <button onclick="selectedCategory='${cat}'; showScreen('library');" class="px-3.5 py-1 rounded-full text-xs bg-luxuryCard border border-luxuryBorder text-gray-300 whitespace-nowrap active:border-gold">${cat}</button>
                                `).join('')}
                            </div>
                        </div>

                        <div>
                            <h3 class="text-sm font-bold border-r-2 border-gold pr-2 mb-3">أحدث الكتب المتاحة (${books.length})</h3>
                            <div class="grid grid-cols-2 gap-3">
                                ${books.map(b => `
                                    <div onclick="showScreen('details', '${b.id}')" class="bg-luxuryCard border border-luxuryBorder rounded-xl overflow-hidden cursor-pointer hover:border-gold/40 transition-all">
                                        <div class="
