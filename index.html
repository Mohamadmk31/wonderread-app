<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WonderRead | المكتبة الرقمية المتكاملة</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: { DEFAULT: '#D4AF37', light: '#F3E5AB', dark: '#AA7C11' },
                        luxuryBg: '#0D0D0D',
                        luxuryCard: '#161616',
                        luxuryBorder: '#2A2A2A'
                    }
                }
            }
        }
    </script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0D0D0D;
            color: #FFFFFF;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
        }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 4px; }
    </style>
</head>
<body class="bg-[#0D0D0D] text-white">

    <div id="root">
        <div style="display:flex; justify-content:center; align-items:center; height:100vh; flex-direction:column; gap:12px;">
            <div style="width:36px; height:36px; border:3px solid #D4AF37; border-top-color:transparent; border-radius:50%; animation:spin 1s linear infinite;"></div>
            <p style="color:#D4AF37; font-size:13px; font-family:'Cairo',sans-serif;">جاري تشغيل منصة WonderRead...</p>
        </div>
        <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
    </div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        let db = null;
        try {
            const firebaseConfig = {
                apiKey: "AIzaSyB5y-QiubQ6X-Cu0orHAT58S1uGpglnxbc",
                authDomain: "wonderread-app-e760b.firebaseapp.com",
                projectId: "wonderread-app-e760b",
                storageBucket: "wonderread-app-e760b.firebasestorage.app"
            };
            if (window.firebase && !firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
            } else if (window.firebase) {
                db = firebase.firestore();
            }
        } catch (e) {
            console.warn("تنبيه الاتصال السحابي:", e);
        }

        // عنوان محفظة بايننس (يمكنك تعديلها من الكود أو لوحة الإدارة)
        const BINANCE_USDT_ADDRESS = "0x71c2b5e1974780447385012586f189f7831fbe61"; // شبكة BEP20 / TRC20

        // قائمة الكلمات المحظورة والمسيئة
        const BANNED_WORDS = [
            "شتم", "سب", "حقير", "سافل", "لعنة", "نصاب", "احتيال", "كلب", "حمار", "غبي", "تافه", "منحط", "قذر"
        ];

        // التحقق من وجود روابط
        const containsLink = (text) => {
            const urlPattern = /(https?:\/\/[^\s]+)|(www\.[^\s]+)|([a-zA-Z0-9_\-\.]+\.[a-zA-Z]{2,5})/gi;
            return urlPattern.test(text);
        };

        // التحقق من الكلمات المسيئة
        const containsBannedWords = (text) => {
            return BANNED_WORDS.some(word => text.includes(word));
        };

        // دالة ضغط الصور وتصغير حجمها للسحابة
        const compressImage = (file, maxWidth = 450, quality = 0.7) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const elem = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        elem.width = width;
                        elem.height = height;
                        const ctx = elem.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(elem.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = reject;
                };
                reader.onerror = reject;
            });
        };

        const INITIAL_BOOKS = [
            {
                id: "b1",
                title: "سر الفخامة والريادة المالية",
                author: "د. عبد الرحمن الفايز",
                description: "دليل عملي شامل لبناء الثروة وتطوير العقلية المالية الفاخرة وإدارة الأصول بكفاءة.",
                category: "إدارة وأعمال",
                cover_image: "https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&q=80&w=400",
                pdf_url: "",
                price: 15.00,
                pages: 280,
                rating: 4.8
            }
        ];

        const CATEGORIES = ["الكل", "إدارة وأعمال", "تاريخ", "تكنولوجيا", "تطوير ذات", "روايات"];

        function WonderReadApp() {
            const [currentScreen, setCurrentScreen] = useState('home');
            const [books, setBooks] = useState(() => {
                const saved = localStorage.getItem('wonderread_books');
                return saved ? JSON.parse(saved) : INITIAL_BOOKS;
            });
            const [isCloudActive, setIsCloudActive] = useState(false);
            const [selectedBook, setSelectedBook] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('الكل');
            const [readerBook, setReaderBook] = useState(null);
            const [isNightMode, setIsNightMode] = useState(true);

            // التعليقات
            const [comments, setComments] = useState({});
            const [newCommentName, setNewCommentName] = useState('');
            const [newCommentText, setNewCommentText] = useState('');

            // النوافذ المنبثقة
            const [showComplaintModal, setShowComplaintModal] = useState(false);
            const [complaintText, setComplaintText] = useState('');
            const [complaintSender, setComplaintSender] = useState('');

            const [showPaymentModal, setShowPaymentModal] = useState(false);
            const [payingBook, setPayingBook] = useState(null);
            const [txidInput, setTxidInput] = useState('');

            // إضافة كتاب جديد
            const [newBook, setNewBook] = useState({
                title: '', author: '', category: 'إدارة وأعمال', price: '', pages: 150, cover_image: '', pdf_url: '', description: ''
            });
            const [coverPreview, setCoverPreview] = useState(null);
            const [isSubmitting, setIsSubmitting] = useState(false);

            // المزامنة مع سحابة Firestore
            useEffect(() => {
                if (db) {
                    try {
                        const unsubBooks = db.collection("books").onSnapshot(snapshot => {
                            if (!snapshot.empty) {
                                const cloudData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                                setBooks(cloudData);
                                localStorage.setItem('wonderread_books', JSON.stringify(cloudData));
                                setIsCloudActive(true);
                            } else {
                                INITIAL_BOOKS.forEach(b => db.collection("books").add(b));
                                setIsCloudActive(true);
                            }
                        }, () => setIsCloudActive(false));

                        const unsubComments = db.collection("comments").onSnapshot(snapshot => {
                            const cMap = {};
                            snapshot.forEach(doc => {
                                const data = doc.data();
                                if (!cMap[data.bookId]) cMap[data.bookId] = [];
                                cMap[data.bookId].push({ id: doc.id, ...data });
                            });
                            setComments(cMap);
                        });

                        return () => { unsubBooks(); unsubComments(); };
                    } catch (err) {
                        setIsCloudActive(false);
                    }
                }
            }, []);

            // رفع وصغر صورة الغلاف
            const handleImageUpload = async (e) => {
                const file = e.target.files[0];
                if (file) {
                    try {
                        const compressedBase64 = await compressImage(file, 450, 0.7);
                        setCoverPreview(compressedBase64);
                        setNewBook(prev => ({ ...prev, cover_image: compressedBase64 }));
                    } catch (err) {
                        alert("تعذر معالجة الصورة، جرب صورة أخرى.");
                    }
                }
            };

            // إضافة كتاب
            const handleAddBook = async (e) => {
                e.preventDefault();
                if (!newBook.title || !newBook.author || newBook.price === '') {
                    alert("يرجى ملء الحقول المطلوبة (*)");
                    return;
                }

                setIsSubmitting(true);
                const defaultCover = "https://images.unsplash.com/photo-1543002588-bfa74002ed7e?auto=format&fit=crop&q=80&w=400";
                const item = {
                    title: newBook.title,
                    author: newBook.author,
                    category: newBook.category,
                    price: parseFloat(newBook.price) || 0,
                    pages: parseInt(newBook.pages) || 100,
                    description: newBook.description || 'لا يوجد وصف متوفر.',
                    cover_image: newBook.cover_image || defaultCover,
                    pdf_url: newBook.pdf_url || '',
                    rating: 5.0,
                    createdAt: new Date().toISOString()
                };

                try {
                    if (isCloudActive && db) {
                        await db.collection("books").add(item);
                    } else {
                        const local = [{ id: 'loc_' + Date.now(), ...item }, ...books];
                        setBooks(local);
                        localStorage.setItem('wonderread_books', JSON.stringify(local));
                    }
                    alert("تم حفظ الكتاب بنجاح!");
                    setNewBook({ title: '', author: '', category: 'إدارة وأعمال', price: '', pages: 150, cover_image: '', pdf_url: '', description: '' });
                    setCoverPreview(null);
                } catch (err) {
                    alert("حدث خطأ: " + err.message);
                } finally {
                    setIsSubmitting(false);
                }
            };

            const handleDeleteBook = async (id) => {
                if (confirm("هل تريد حذف هذا الكتاب نهائياً من المكتبة؟")) {
                    if (isCloudActive && db) {
                        try { await db.collection("books").doc(id).delete(); } catch(e){}
                    }
                    const updated = books.filter(b => b.id !== id);
                    setBooks(updated);
                    localStorage.setItem('wonderread_books', JSON.stringify(updated));
                }
            };

            // إرسال التعليق مع الفحص الأمني الصارم
            const handleAddComment = async (bookId) => {
                if (!newCommentName.trim() || !newCommentText.trim()) {
                    alert("يرجى كتابة الاسم والتعليق.");
                    return;
                }

                // 1. فحص وجود روابط
                if (containsLink(newCommentText)) {
                    alert("⚠️ غير مسموح بنشر الروابط أو عناوين المواقع إطلاقاً داخل التعليق!");
                    return;
                }

                // 2. فحص الألفاظ المسيئة
                if (containsBannedWords(newCommentText)) {
                    alert("⚠️ يحتوي تعليقك على عبارات غير لائقة، يرجى الالتزام بآداب الحوار.");
                    return;
                }

                const commentData = {
                    bookId: bookId,
                    name: newCommentName.trim(),
                    text: newCommentText.trim(),
                    date: new Date().toLocaleDateString('ar-EG')
                };

                try {
                    if (isCloudActive && db) {
                        await db.collection("comments").add(commentData);
                    } else {
                        const currentList = comments[bookId] || [];
                        setComments({ ...comments, [bookId]: [...currentList, { id: 'c_' + Date.now(), ...commentData }] });
                    }
                    setNewCommentText('');
                    alert("شكراً لك! تم نشر تعليقك بنجاح.");
                } catch (e) {
                    alert("تعذر حفظ التعليق: " + e.message);
                }
            };

            // إرسال شكوى أو مقترح
            const handleSendComplaint = async (e) => {
                e.preventDefault();
                if (!complaintText.trim()) return;

                try {
                    if (isCloudActive && db) {
                        await db.collection("complaints").add({
                            sender: complaintSender.trim() || "قارئ مجهول",
                            message: complaintText.trim(),
                            date: new Date().toLocaleString('ar-EG')
                        });
                    }
                    alert("تم إرسال بلاغك/شكواك بنجاح للإدارة، نشكر اهتمامك وحرصك.");
                    setComplaintText('');
                    setComplaintSender('');
                    setShowComplaintModal(false);
                } catch (err) {
                    alert("حدث خطأ أثناء الإرسال: " + err.message);
                }
            };

            // إتمام عملية الدفع عبر بايننس
            const handleConfirmPayment = () => {
                if (!txidInput.trim()) {
                    alert("يرجى إدخال رقم العملية (TXID / Hash) للتحقق من التحويل.");
                    return;
                }
                alert(`تم استلام تفاصيل العملية بنجاح! سيتم فحص التحويل وتأكيد صلاحية قراءة كتاب "${payingBook.title}".`);
                setShowPaymentModal(false);
                setTxidInput('');
            };

            return (
                <div className="min-h-screen bg-luxuryBg text-white pb-20 select-none">
                    {/* الترويسة العلوية */}
                    <header className="sticky top-0 z-40 bg-luxuryBg/95 backdrop-blur-md border-b border-luxuryBorder px-4 py-3 flex justify-between items-center max-w-md mx-auto">
                        <div className="flex items-center space-x-2 space-x-reverse cursor-pointer" onClick={() => setCurrentScreen('home')}>
                            <div className="w-9 h-9 bg-gradient-to-tr from-gold-dark to-gold rounded-lg flex items-center justify-center shadow-lg font-serif font-black text-black text-xl">
                                W
                            </div>
                            <div>
                                <h1 className="text-lg font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-l from-gold to-white">WonderRead</h1>
                                <p className="text-[9px] text-gold/80 -mt-1 font-light">
                                    {isCloudActive ? "سحابي متصل ✓" : "المكتبة الرقمية"}
                                </p>
                            </div>
                        </div>

                        <div className="flex items-center space-x-2 space-x-reverse">
                            {/* زر الشكاوى */}
                            <button 
                                onClick={() => setShowComplaintModal(true)}
                                title="إرسال شكوى أو مقترح"
                                className="w-8 h-8 rounded-full bg-red-950/40 border border-red-500/40 flex items-center justify-center text-red-400 text-xs font-bold hover:bg-red-900/50"
                            >
                                ⚠️
                            </button>
                            {/* زر لوحة الإدارة */}
                            <button 
                                onClick={() => setCurrentScreen('admin')}
                                className={`px-3 py-1.5 rounded-full text-xs font-semibold transition-all ${currentScreen === 'admin' ? 'bg-gold text-black' : 'bg-gold/10 text-gold border border-gold/30'}`}
                            >
                                الإدارة
                            </button>
                        </div>
                    </header>

                    {/* جسم التطبيق */}
                    <main className="max-w-md mx-auto px-4 pt-4">

                        {/* 1. الرئيسية */}
                        {currentScreen === 'home' && (
                            <div className="space-y-6">
                                <div className="rounded-2xl border border-gold/20 p-5 bg-gradient-to-br from-luxuryCard to-black shadow-xl">
                                    <span className="text-[10px] font-bold text-gold bg-gold/10 px-2.5 py-1 rounded-full border border-gold/20">
                                        منصة القراءة الحرة
                                    </span>
                                    <h2 className="text-xl font-extrabold mt-3 text-white leading-tight">عالم من المعرفة الفاخرة بين يديك</h2>
                                    <p className="text-xs text-gray-400 mt-2 font-light">تصفح الكتب واقرأ التعليقات وتفاعل مع نخبة القراء بأمان تام.</p>
                                    <button 
                                        onClick={() => setCurrentScreen('library')}
                                        className="mt-4 px-4 py-2 bg-gradient-to-l from-gold-dark to-gold text-black rounded-lg text-xs font-bold shadow-lg"
                                    >
                                        استكشف المكتبة الآن
                                    </button>
                                </div>

                                <div>
                                    <h3 className="text-sm font-bold border-r-2 border-gold pr-2 mb-3">التصنيفات</h3>
                                    <div className="flex space-x-2 space-x-reverse overflow-x-auto pb-1">
                                        {CATEGORIES.map(cat => (
                                            <button 
                                                key={cat}
                                                onClick={() => { setSelectedCategory(cat); setCurrentScreen('library'); }}
                                                className="px-3.5 py-1 rounded-full text-xs bg-luxuryCard border border-luxuryBorder text-gray-300 whitespace-nowrap active:border-gold"
                                            >
                                                {cat}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div>
                                    <h3 className="text-sm font-bold border-r-2 border-gold pr-2 mb-3">أحدث الكتب المتاحة ({books.length})</h3>
                                    <div className="grid grid-cols-2 gap-3">
                                        {books.map(b => (
                                            <div 
                                                key={b.id} 
                                                onClick={() => { setSelectedBook(b); setCurrentScreen('details'); }}
                                                className="bg-luxuryCard border border-luxuryBorder rounded-xl overflow-hidden cursor-pointer hover:border-gold/40 transition-all"
                                            >
                                                <div className="aspect-[3/4] overflow-hidden bg-black/40">
                                                    <img src={b.cover_image} alt={b.title} className="w-full h-full object-cover" />
                                                </div>
                                                <div className="p-2.5 space-y-1">
                                                    <h4 className="text-xs font-bold text-white line-clamp-1">{b.title}</h4>
                                                    <p className="text-[10px] text-gray-400 line-clamp-1">{b.author}</p>
                                                    <div className="flex justify-between items-center pt-1 border-t border-luxuryBorder">
                                                        <span className="text-[9px] text-gold font-bold">{b.price === 0 ? "مجاني" : `${b.price} $`}</span>
                                                        <span className="text-[9px] text-gray-400">{b.category}</span>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 2. تفاصيل الكتاب + التعليقات + الدفع */}
                        {currentScreen === 'details' && selectedBook && (
                            <div className="space-y-6">
                                <button onClick={() => setCurrentScreen('home')} className="text-xs text-gold flex items-center gap-1">
                                    <span>← العودة للرئيسية</span>
                                </button>
                                <div className="text-center">
                                    <div className="w-40 aspect-[3/4] mx-auto rounded-xl overflow-hidden shadow-2xl border border-gold/30 mb-3">
                                        <img src={selectedBook.cover_image} alt={selectedBook.title} className="w-full h-full object-cover" />
                                    </div>
                                    <h2 className="text-base font-black text-white">{selectedBook.title}</h2>
                                    <p className="text-xs text-gold mt-0.5">{selectedBook.author}</p>
                                    <p className="text-xs text-emerald-400 font-bold mt-1">
                                        {selectedBook.price === 0 ? "كتاب مجاني بالكامل" : `السعر: ${selectedBook.price} USDT (دولار)`}
                                    </p>
                                </div>

                                <div className="bg-luxuryCard p-3 rounded-xl border border-luxuryBorder text-xs text-gray-300 leading-relaxed">
                                    <h4 className="text-gold font-bold mb-1">نبذة عن الكتاب:</h4>
                                    {selectedBook.description}
                                </div>

                                {/* أزرار القراءة أو الشراء عبر بايننس */}
                                <div className="space-y-2">
                                    {selectedBook.price > 0 ? (
                                        <button 
                                            onClick={() => { setPayingBook(selectedBook); setShowPaymentModal(true); }}
                                            className="w-full py-3 bg-gradient-to-l from-yellow-600 to-yellow-500 text-black rounded-xl font-bold text-xs flex justify-center items-center gap-2 shadow-lg"
                                        >
                                            <span>🟡 شراء الكتاب عبر محفظة بايننس (Binance)</span>
                                        </button>
                                    ) : null}

                                    <button 
                                        onClick={() => { setReaderBook(selectedBook); setCurrentScreen('reader'); }}
                                        className="w-full py-3 bg-gradient-to-l from-gold-dark to-gold text-black rounded-xl font-bold text-xs shadow-lg"
                                    >
                                        فتح وقراءة صفحات الكتاب
                                    </button>
                                </div>

                                {/* قسم التعليقات المحمية والآمنة */}
                                <div className="border-t border-luxuryBorder pt-4 space-y-4">
                                    <h3 className="text-xs font-bold text-gold flex items-center gap-1.5">
                                        <span>💬 آراء ومراجعات القراء</span>
                                        <span className="text-[10px] text-gray-400">({(comments[selectedBook.id] || []).length})</span>
                                    </h3>

                                    {/* نموذج إضافة تعليق */}
                                    <div className="bg-luxuryCard p-3 rounded-xl border border-luxuryBorder space-y-2 text-xs">
                                        <input 
                                            type="text" 
                                            placeholder="اسمك الكريم..." 
                                            value={newCommentName} 
                                            onChange={e => setNewCommentName(e.target.value)}
                                            className="w-full bg-luxuryBg border border-luxuryBorder rounded-lg p-2 text-white focus:outline-none"
                                        />
                                        <textarea 
                                            rows="2" 
                                            placeholder="اكتب تعليقك هنا (يُمنع وضع الروابط أو الألفاظ غير اللائقة)..." 
                                            value={newCommentText} 
                                            onChange={e => setNewCommentText(e.target.value)}
                                            className="w-full bg-luxuryBg border border-luxuryBorder rounded-lg p-2 text-white focus:outline-none"
                                        ></textarea>
                                        <button 
                                            onClick={() => handleAddComment(selectedBook.id)}
                                            className="w-full py-2 bg-luxuryBorder hover:bg-gold/20 text-gold rounded-lg font-bold"
                                        >
                                            نشر التعليق
                                        </button>
                                    </div>

                                    {/* عرض التعليقات السابقة */}
                                    <div className="space-y-2">
                                        {(comments[selectedBook.id] || []).map(c => (
                                            <div key={c.id} className="bg-luxuryCard/70 p-2.5 rounded-lg border border-luxuryBorder/70 text-xs">
                                                <div className="flex justify-between items-center mb-1">
                                                    <span className="font-bold text-gold">{c.name}</span>
                                                    <span className="text-[9px] text-gray-500">{c.date}</span>
                                                </div>
                                                <p className="text-gray-300 leading-normal">{c.text}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 3. قارئ الكتب */}
                        {currentScreen === 'reader' && readerBook && (
                            <div className={`p-4 rounded-2xl min-h-[550px] flex flex-col justify-between border border-luxuryBorder relative overflow-hidden ${isNightMode ? 'bg-[#121212] text-gray-100' : 'bg-white text-gray-900'}`}>
